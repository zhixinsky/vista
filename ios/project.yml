name: CarVista
options:
  bundleIdPrefix: local.carvista
  deploymentTarget:
    iOS: '17.0'
targets:
  CarVista:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: BuiltinWallpapers
        type: folder
        buildPhase: resources
      - path: Vendor/WQFiles
        excludes: [LICENSE, tests]
      - path: LICENSE
        buildPhase: resources
      - path: Vendor/NOTICE.md
        buildPhase: resources
    dependencies:
      - sdk: Security.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carvista
        INFOPLIST_KEY_CFBundleDisplayName: CarVista
        INFOPLIST_FILE: Info.plist
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: '将裁剪和校色后的壁纸保存到你的相册。'
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        MARKETING_VERSION: '1.1.1'
        CURRENT_PROJECT_VERSION: '16'
        CARVISTA_RELEASE_CHANNEL: stable
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: 'UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: CarVista.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridge.h
        HEADER_SEARCH_PATHS: '$(SRCROOT)/Vendor/WQFiles'
        CLANG_ENABLE_OBJC_ARC: YES
  CarVistaModelTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ModelTests]
    dependencies:
      - target: CarVista
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carvista.modeltests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
  CarVistaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: CarVista
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.carvista.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: '5.0'
schemes:
  CarVista:
    build:
      targets:
        CarVista: all
        CarVistaUITests: [test]
        CarVistaModelTests: [test]
    test:
      targets: [CarVistaModelTests, CarVistaUITests]
